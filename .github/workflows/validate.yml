name: validate

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: validation needs to read the tree, nothing else.
permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not persist the GITHUB_TOKEN in the checked-out repo's git config:
          # PR code runs here and must not be able to read a write-capable token.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML for strict frontmatter parsing
        run: python3 -m pip install --quiet pyyaml

      - name: Validate SKILL.md against the Agent Skills spec
        run: python3 scripts/validate_skills.py

      - name: Check plugin manifest is valid JSON
        run: |
          python3 -c "import json;json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json;json.load(open('.claude-plugin/marketplace.json'))"

      - name: Check every skill is discoverable through the marketplace
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          mp = json.load(open('.claude-plugin/marketplace.json'))
          names = {p['name'] for p in mp['plugins']}
          assert names, 'marketplace has no plugins'
          skills = {p.name for p in pathlib.Path('skills').iterdir() if p.is_dir() and not p.name.startswith('.')}
          print('skills:', sorted(skills))
          print('marketplace plugins:', sorted(names))
          # A plugin name may differ from the skill directory name. A skill is
          # discoverable when a plugin advertises it in its description/tags.
          discoverable = set()
          for p in mp['plugins']:
              text = (p.get('description', '') + ' ' + ' '.join(p.get('tags', []))).lower()
              discoverable.update(s for s in skills if s.lower() in text)
          missing = sorted(skills - discoverable)
          if missing:
              print('ERROR: skills not discoverable via marketplace:', missing, file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Shell installer is syntactically valid
        run: bash -n install.sh

      - name: PowerShell installer is syntactically valid
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
