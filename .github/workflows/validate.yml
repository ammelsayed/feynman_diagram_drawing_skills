name: validate

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: validation reads the tree and nothing else.
permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not persist the GITHUB_TOKEN in the checked-out repo's git config:
          # PR code runs here and must not read a write-capable token.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the YAML parser
        run: python3 -m pip install --quiet pyyaml

      - name: Check the skill files and the marketplace listing
        run: |
          python3 - <<'EOF'
          import json, pathlib, re, sys, yaml

          SLUG = re.compile(r'^[a-z0-9]+(?:-[a-z0-9]+)*$')
          NAME_MAX, DESC_MAX = 64, 1024
          errors = []

          def split_front_matter(path):
              lines = path.read_text(encoding='utf-8').splitlines()
              if not lines or lines[0] != '---':
                  return None, None, 'first line is not ---'
              for i in range(1, len(lines)):
                  if lines[i] == '---':
                      return '\n'.join(lines[1:i]), '\n'.join(lines[i + 1:]), None
              return None, None, 'no closing --- line'

          skills_dir = pathlib.Path('skills')
          roots = sorted(p for p in skills_dir.iterdir()
                         if p.is_dir() and not p.name.startswith('.')) if skills_dir.is_dir() else []
          if not roots:
              errors.append('skills/: no skill directories')

          for d in roots:
              f = d / 'SKILL.md'
              if f.is_symlink() or not f.is_file():
                  errors.append('%s: not a regular file' % f)
                  continue
              if f.stat().st_size == 0:
                  errors.append('%s: empty' % f)
                  continue
              head, body, why = split_front_matter(f)
              if why:
                  errors.append('%s: %s' % (f, why))
                  continue
              if not body.strip():
                  errors.append('%s: no instructions after the front matter' % f)
                  continue
              try:
                  meta = yaml.safe_load(head)
              except yaml.YAMLError as e:
                  errors.append('%s: front matter is not valid YAML: %s' % (f, e))
                  continue
              if not isinstance(meta, dict):
                  errors.append('%s: front matter is not a mapping' % f)
                  continue
              name = meta.get('name')
              if not isinstance(name, str) or not name.strip():
                  errors.append('%s: no name' % f)
              else:
                  name = name.strip()
                  if not SLUG.match(name):
                      errors.append("%s: name %r is not a lower-case slug" % (f, name))
                  elif len(name) > NAME_MAX:
                      errors.append('%s: name is %d characters, over %d' % (f, len(name), NAME_MAX))
                  elif name != d.name:
                      errors.append("%s: name %r does not match directory %r" % (f, name, d.name))
              desc = meta.get('description')
              if not isinstance(desc, str) or not desc.strip():
                  errors.append('%s: no description' % f)
              elif len(' '.join(desc.split())) > DESC_MAX:
                  errors.append('%s: description is over %d characters' % (f, DESC_MAX))

          mp_path = pathlib.Path('.claude-plugin/marketplace.json')
          plug_path = pathlib.Path('.claude-plugin/plugin.json')
          mp, plug = {}, {}
          for path, kind in ((mp_path, 'marketplace'), (plug_path, 'plugin')):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception as e:
                  errors.append('%s: %s' % (path, e))
                  continue
              if kind == 'marketplace':
                  mp = data
              else:
                  plug = data
          if not plug:
              errors.append('%s: unreadable' % plug_path)

          plugins = mp.get('plugins') or []
          if not plugins:
              errors.append('%s: no plugins' % mp_path)
          advertised = set()
          for plugin in plugins:
              entries = plugin.get('skills') or []
              if not isinstance(entries, list):
                  errors.append('%s: skills is not a list' % mp_path)
                  continue
              for entry in entries:
                  if not isinstance(entry, str):
                      errors.append('%s: a skills entry is not a string' % mp_path)
                      continue
                  path = pathlib.Path(entry)
                  if not path.is_dir():
                      errors.append('%s: skills entry %s is not a directory' % (mp_path, entry))
                      continue
                  skill_md = path / 'SKILL.md'
                  if skill_md.is_symlink() or not skill_md.is_file():
                      errors.append('%s: %s has no SKILL.md file' % (mp_path, entry))
                      continue
                  advertised.add(path.name)
          on_disk = {d.name for d in roots}
          for slug in sorted(on_disk - advertised):
              errors.append('%s: skill %s is not listed in a plugin' % (mp_path, slug))
          for slug in sorted(advertised - on_disk):
              errors.append('%s: lists %s, which is not on disk' % (mp_path, slug))

          if errors:
              print('\n'.join('ERROR: ' + e for e in errors), file=sys.stderr)
              sys.exit(1)
          print('ok: ' + ', '.join(sorted(on_disk)))
          EOF
