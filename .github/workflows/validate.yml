name: validate

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: validation reads the tree and nothing else.
permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not persist the GITHUB_TOKEN in the checked-out repo's git config:
          # PR code runs here and must not read a write-capable token.
          persist-credentials: false

      - name: Check the skill files and the marketplace listing
        run: |
          python3 - <<'EOF'
          import json, pathlib, re, sys

          SLUG = re.compile(r'^[a-z0-9]+(?:-[a-z0-9]+)*$')
          BLOCK = ('>', '|', '>-', '|-', '>+', '|+')
          errors = []

          def front_matter(path):
              lines = path.read_text(encoding='utf-8').splitlines()
              if not lines or lines[0] != '---':
                  return None, None, 'first line is not ---'
              try:
                  end = lines.index('---', 1)
              except ValueError:
                  return None, None, 'no closing --- line'
              return lines[1:end], lines[end + 1:], None

          def fields_of(block):
              out, key = {}, None
              for line in block:
                  m = re.match(r'^([A-Za-z_-]+):(.*)$', line)
                  if m:
                      key, out[m.group(1)] = m.group(1), m.group(2).strip()
                  elif key and line[:1] in (' ', '\t') and line.strip():
                      out[key] = (out[key] + ' ' + line.strip()).strip()
                  elif line.strip():
                      key = None
              return out

          def block_value(block, key):
              for i, line in enumerate(block):
                  if line.startswith(key + ':'):
                      return ' '.join(x.strip() for x in block[i + 1:]
                                      if x[:1] in (' ', '\t') and x.strip())
              return ''

          def scalar(value):
              if len(value) >= 2 and value[0] == value[-1] and value[0] in '"\'':
                  return value[1:-1].strip()
              return value.strip()

          skills_dir = pathlib.Path('skills')
          roots = sorted(p for p in skills_dir.iterdir()
                         if p.is_dir() and not p.name.startswith('.')) if skills_dir.is_dir() else []
          if not roots:
              errors.append('skills/: no skill directories')

          for d in roots:
              f = d / 'SKILL.md'
              if f.is_symlink() or not f.is_file():
                  errors.append(f'{f}: not a regular file')
                  continue
              if f.stat().st_size == 0:
                  errors.append(f'{f}: empty')
                  continue
              head, body, why = front_matter(f)
              if why:
                  errors.append(f'{f}: {why}')
                  continue
              if not '\n'.join(body).strip():
                  errors.append(f'{f}: no instructions after the front matter')
                  continue
              fm = fields_of(head)
              name = scalar(fm.get('name', ''))
              if not name:
                  errors.append(f'{f}: no name')
              elif not SLUG.match(name):
                  errors.append(f"{f}: name '{name}' is not a lower-case slug")
              elif name != d.name:
                  errors.append(f"{f}: name '{name}' does not match directory '{d.name}'")
              raw = fm.get('description', '')
              desc = block_value(head, 'description') if raw in BLOCK else scalar(raw)
              desc = ' '.join(desc.split())
              if not desc:
                  errors.append(f'{f}: no description')
              elif len(desc) > 1024:
                  errors.append(f'{f}: description is {len(desc)} characters, over 1024')
              if raw in BLOCK and not desc:
                  errors.append(f'{f}: empty description block')

          mp_path = pathlib.Path('.claude-plugin/marketplace.json')
          plug_path = pathlib.Path('.claude-plugin/plugin.json')
          mp = {}
          for path in (mp_path, plug_path):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception as e:
                  errors.append(f'{path}: {e}')
                  continue
              if path == mp_path:
                  mp = data

          plugins = mp.get('plugins') or []
          if not plugins:
              errors.append(f'{mp_path}: no plugins')
          advertised = set()
          for p in plugins:
              entries = p.get('skills') or []
              if not isinstance(entries, list):
                  errors.append(f'{mp_path}: skills is not a list')
                  continue
              for slug in entries:
                  if isinstance(slug, str):
                      advertised.add(slug)
                  else:
                      errors.append(f'{mp_path}: a skills entry is not a string')
          on_disk = {d.name for d in roots}
          for slug in sorted(on_disk - advertised):
              errors.append(f'{mp_path}: skill {slug} is not advertised')
          for slug in sorted(advertised - on_disk):
              errors.append(f'{mp_path}: advertises {slug}, which is not on disk')

          if errors:
              print('\n'.join('ERROR: ' + e for e in errors), file=sys.stderr)
              sys.exit(1)
          print('ok: ' + ', '.join(sorted(on_disk)))
          EOF
